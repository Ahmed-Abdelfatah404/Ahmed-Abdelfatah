# ============================================================================
# GITHUB ACTIONS AUTO-BUILDER WORKFLOW (.github/workflows/build-mac-app.yml) - v3
# Automatically builds and compiles your macOS App and uploads it to GitHub Releases!
# Optimized for Node 24 to prevent deprecation warnings!
# ============================================================================
name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*' # Triggers when you push a version tag (e.g. v1.0.0)
  workflow_dispatch: # Allows you to trigger the build manually from the Actions tab!

jobs:
  release:
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24 # 🍏 Upgraded to Node 24 to match latest GitHub runner standards
          # 🚨 FIX: Removed `cache: 'npm'` because there is no pre-existing lockfile (package-lock.json) in your static repo yet!
          # This allows the setup action to run completely error-free.

      - name: Initialize Electron App Structure
        run: |
          # Create package.json if it doesn't exist
          if [ ! -f package.json ]; then
            echo '{\n              "name": "ahmed-abdelfatah-app",\n              "version": "1.0.0",\n              "main": "main.js",\n              "scripts": {\n                "build": "electron-builder --mac"\n              },\n              "build": {\n                "appId": "com.ahmed.abdelfatah.app",\n                "productName": "Ahmed Abd-Elfatah App",\n                "mac": {\n                  "category": "public.app-category.education",\n                  "target": ["dmg", "zip"]\n                }\n              }\n            }' > package.json
          fi

          # Create main.js if it doesn't exist
          if [ ! -f main.js ]; then
            echo "const { app, BrowserWindow, session } = require('electron');\n            function createWindow() {\n                session.defaultSession.webRequest.onBeforeSendHeaders((details, callback) => {\n                    details.requestHeaders['User-Agent'] = 'AhmedAcademySecureApp_SecureVideoSessionEngine';\n                    callback({ cancel: false, requestHeaders: details.requestHeaders });\n                });\n                const mainWindow = new BrowserWindow({\n                    width: 1280,\n                    height: 800,\n                    title: 'Ahmed Abd-Elfatah App',\n                    autoHideMenuBar: true,\n                    webPreferences: {\n                        contextIsolation: true,\n                        nodeIntegration: false\n                    }\n                });\n                mainWindow.loadURL('https://ahmed-abd-elfatah.pages.dev?app=true');\n            }\n            app.whenReady().then(() => {\n                createWindow();\n                app.on('activate', () => {\n                    if (BrowserWindow.getAllWindows().length === 0) createWindow();\n                });\n            });\n            app.on('window-all-closed', () => {\n                if (process.platform !== 'darwin') app.quit();\n            });" > main.js
          fi

      - name: Install Dependencies
        run: |
          npm install electron electron-builder --save-dev

      - name: Build macOS Application
        run: |
          npx electron-builder --mac --universal
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Binaries to Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            dist/*.dmg
            dist/*.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
